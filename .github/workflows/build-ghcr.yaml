name: Build GHCR image

# 个人 fork 用：先跑 vet/gofmt 与 server、storage 包测试，通过后构建 linux/amd64+arm64 镜像推到 ghcr.io/<owner>/dex。
# 手机/本机不做构建，一律走这里。

on:
  push:
    branches: [master, fix/session-groups-decouple, fix/session-scope-coverage]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: go vet
        run: go vet ./server/... ./storage/...
      - name: gofmt
        run: |
          out=$(gofmt -l ./server ./storage)
          if [ -n "$out" ]; then
            echo "以下文件未经 gofmt 格式化："
            echo "$out"
            exit 1
          fi
      # storage 里 postgres/mysql/etcd/k8s 的测试依赖外部服务，未设置对应环境变量时会自动 skip；
      # memory/sqlite3(ent、sql) 的一致性测试可以直接跑。
      - run: go test -count=1 ./server/... ./storage/...

  image:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dex
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
